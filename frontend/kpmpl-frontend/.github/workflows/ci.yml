name: phase-3-security-frontend-ci

on:
  push:
    branches: [ integration/phase-3-security ]
  pull_request:

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter kpmpl-frontend migrate:deploy
      - run: pnpm --filter kpmpl-frontend seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=setup --project=dev --project=prod-like --grep "CSP|security headers"
        env:
          E2E_BASE_URL: http://localhost:5173
      - run: docker compose down
        if: always()
