# KPMPL local web (nginx) server block — audit KPMPL-003.
# This is the durable copy of the config bind-mounted into the kpmpl-local-web container
# (which previously used a throwaway file in %TEMP% with no security headers).
# Hardened in place + `docker exec kpmpl-local-web nginx -s reload` on 2026-11-04.
# NOTE: the container's mount source still points at %TEMP%\kpmpl-local-nginx.conf; keep the
# two files in sync or recreate the container with -v "<workspace>/nginx-local.conf:/etc/nginx/conf.d/default.conf".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend re-checks the upload size (brief §5.9); allow multipart overhead in the proxy.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Never cache the SPA shell: a stale index.html keeps users on an old build (deployment rule 6).
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fingerprinted assets are immutable.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
