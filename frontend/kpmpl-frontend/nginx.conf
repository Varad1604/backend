# KPMPL Gate-to-Bill — nginx server block (template).
# Copied to /etc/nginx/templates/default.conf.template; the nginx image runs envsubst at start.
# Required env: BACKEND_UPSTREAM  (e.g. http://backend:3000 — the backend serves /api/v1/*)
# Only ${BACKEND_UPSTREAM} uses braces; nginx's own variables are written without braces on purpose.
#
# One origin: the SPA and /api share scheme+host+port, so the backend's __Host-kpmpl_sid cookie
# (Secure, HttpOnly, SameSite=Lax) is first-party, CORS is not needed, and the PDF viewer can frame
# GET /api/v1/document-files/{id}/content. Terminate TLS in front of this container (load balancer
# or ingress) or add a listen 8443 ssl block; HTTPS is mandatory in production.

# Defence in depth for the login endpoint (the backend also enforces 5/min per IP+username).
limit_req_zone $binary_remote_addr zone=kpmpl_login:10m rate=10r/m;

map $http_x_request_id $kpmpl_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are 10 MB max (brief §5.9); allow multipart overhead. The backend re-checks the size.
    client_max_body_size 11m;

    # If a load balancer sits in front, trust its X-Forwarded-For (adjust the CIDR to your network):
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    # ---------- API reverse proxy (headers come from the backend: Helmet, no-store, nosniff) ----------
    location = /api/v1/auth/login {
        limit_req zone=kpmpl_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/snippets/kpmpl-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/conf.d/snippets/kpmpl-proxy.conf;
    }

    # ---------- container health (frontend only; backend health is the backend's /healthz, /readyz) ----------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- static app ----------
    # Hashed build assets: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/kpmpl-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. The app uses a hash router today; this also covers a future browser router.
    location / {
        include /etc/nginx/snippets/kpmpl-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
