# Included by every /api location in nginx.conf. Template: rendered by the nginx image to
# /etc/nginx/conf.d/snippets/kpmpl-proxy.conf (a subdirectory, so it is not loaded as a server block).
proxy_pass ${BACKEND_UPSTREAM};
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $kpmpl_request_id;
proxy_set_header Connection "";
# The browser's Origin header is passed through unchanged; the backend checks it on writes (brief §3 CSRF).
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_request_buffering off;
# HSTS on API responses too (ignored by browsers over plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
