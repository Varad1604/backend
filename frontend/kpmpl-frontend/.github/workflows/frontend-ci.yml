name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # If this frontend lives in a monorepo subfolder, set working-directory (e.g. frontend/).
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (mock / demo, default)
        run: npm run build

      - name: Build (http / production)
        env:
          VITE_API_MODE: http
          VITE_APP_MODE: production
          VITE_API_BASE_URL: /api/v1
        run: npx vite build --outDir dist-http

      - name: No demo code in the production bundle
        run: |
          if grep -R -l -e "Demo Supplier A" -e "kpmpl-proto-db" -e "Make the next save fail" dist-http/assets; then
            echo "::error::demo fixtures or demo tools found in the production bundle"; exit 1
          fi

      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-http
          path: dist-http
          retention-days: 7
